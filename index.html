<!doctype html>
<html lang="en" data-platform="ios" data-theme="light" data-contrast="standard" data-transparency="standard">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Questline</title>
    <meta name="description" content="Your goals, their steps and a timeline. Stored only on your phone." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13110E" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Questline" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <link rel="stylesheet" href="css/screens-2.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="ts-scope">
    <div class="app" id="app">
      <div class="app__screen" id="screen">
        <div class="app__scroll" id="scroll">
          <noscript><p class="app__noscript t-callout">Questline Pocket needs JavaScript to run.</p></noscript>
        </div>
        <div class="app__overlay" id="overlay"></div>
      </div>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden />
  </body>
</html>
